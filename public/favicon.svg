<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background outer ring gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Inner background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#06291a"/>
      <stop offset="100%" stop-color="#021c10"/>
    </linearGradient>

    <!-- Chili body gradient -->
    <linearGradient id="chiliGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#ef233c"/>
      <stop offset="85%" stop-color="#c9184a"/>
      <stop offset="100%" stop-color="#800f2f"/>
    </linearGradient>

    <!-- Chili highlight gradient -->
    <linearGradient id="chiliHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff9999" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>

    <!-- Calyx/stem green gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="chiliGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ef233c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Border Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#borderGrad)"/>

  <!-- Inner Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Behind Chili -->
  <circle cx="260" cy="270" r="160" fill="#10b981" opacity="0.15" filter="blur(30px)"/>

  <!-- Main Chili Group with Shadow -->
  <g filter="url(#dropShadow)" transform="translate(10, 5)">
    <!-- Chili Pepper Body -->
    <!-- Beautiful curved hot chili pepper silhouette -->
    <path d="M 330 150 
             C 340 180, 345 220, 330 265 
             C 310 320, 275 365, 230 400 
             C 195 428, 160 435, 142 432 
             C 135 431, 133 422, 137 417 
             C 155 395, 175 365, 190 325 
             C 208 275, 218 220, 230 180 
             C 240 145, 280 140, 330 150 Z" 
          fill="url(#chiliGrad)" 
          filter="url(#chiliGlow)"/>

    <!-- Chili Highlight Curve along top edge -->
    <path d="M 315 162 
             C 328 190, 330 225, 318 265 
             C 300 315, 268 355, 226 388 
             C 214 397, 206 388, 216 376 
             C 252 340, 280 300, 296 255 
             C 308 220, 305 185, 290 162 
             C 285 155, 305 152, 315 162 Z" 
          fill="url(#chiliHighlight)"/>

    <!-- Calyx (Green cap at top of chili) -->
    <path d="M 270 148 
             C 260 165, 255 178, 245 182 
             C 265 178, 285 178, 300 185 
             C 305 175, 315 165, 332 170 
             C 335 158, 340 145, 345 138 
             C 320 135, 295 138, 270 148 Z" 
          fill="url(#stemGrad)"/>

    <!-- Calyx Crown Leaflets -->
    <path d="M 285 142 
             C 275 160, 260 172, 240 175 
             C 255 165, 270 152, 280 140 Z" 
          fill="#15803d"/>
    <path d="M 315 142 
             C 322 158, 332 170, 345 175 
             C 338 162, 330 150, 322 140 Z" 
          fill="#22c55e"/>

    <!-- Stem (Curved stalk) -->
    <path d="M 310 142 
             C 315 115, 335 85, 375 75 
             C 380 74, 383 80, 378 84 
             C 350 102, 335 120, 325 144 Z" 
          fill="url(#stemGrad)"/>

    <!-- Leaf on Stem -->
    <path d="M 338 115 
             C 365 105, 395 115, 405 130 
             C 395 145, 365 145, 338 130 Z" 
          fill="url(#stemGrad)"/>
    <path d="M 345 122 Q 375 125 398 130" stroke="#86efac" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Small Agriculture Leaf Accent Bottom Right -->
  <g transform="translate(350, 350) rotate(-15) scale(0.65)" filter="url(#dropShadow)">
    <path d="M 0 50 C 0 10, 40 0, 70 0 C 70 40, 50 80, 0 80 Z" fill="url(#borderGrad)"/>
    <path d="M 10 65 Q 40 40 65 5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
